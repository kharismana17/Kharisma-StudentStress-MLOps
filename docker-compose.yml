version: '3.8'

services:
  app:
    image: python:3.10-slim
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn prometheus_client && 
             uvicorn app:app --host 0.0.0.0 --port 8000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus